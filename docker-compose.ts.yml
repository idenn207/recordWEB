# TypeScript 버전. 기존 compose와 같은 포트/볼륨을 쓰므로 둘을 동시에 띄우지 않는다.
#   기존(Python) 정지 → docker compose -f docker-compose.ts.yml up -d --build
# 설정/상태 JSON(channels.json, config.json, cookie.json, yt_*.json)은 기존 파일을 그대로 읽는다.
services:
  recordweb:
    build:
      context: .
      dockerfile: Dockerfile.ts
    image: recordweb-ts:latest
    container_name: recordweb
    init: true
    restart: unless-stopped
    # 컨테이너가 중지되면 녹화 프로세스를 정리하고 후처리를 시작할 시간을 준다.
    stop_grace_period: 30s
    ports:
      # NAS의 LAN IP에만 게시한다(앱 레벨 로그인이 없으므로 네트워크 경계가 유일한 접근 통제).
      - '${RECORDWEB_BIND_IP:?.env에 값을 넣으세요}:5080:5000'
    volumes:
      - ${RECORDWEB_JSON_DIR:?.env에 값을 넣으세요}:/app/json
      - ${RECORDWEB_CHZZK_DIR:?.env에 값을 넣으세요}:/app/chzzk
      # X 스페이스 녹음(.m4a). 채널의 저장 경로 기본값이 xspaces 이다.
      - ${RECORDWEB_XSPACES_DIR:?.env에 값을 넣으세요}:/app/xspaces
